name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # LLM and GitHub are faked in the tests; Redis is used by the RQ test.
      - run: pytest tests/ -v --tb=short
        env:
          REDIS_URL: redis://localhost:6379
          GITHUB_APP_ID: "test"
          GITHUB_WEBHOOK_SECRET: "test"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 . --max-line-length=100 --exclude=.git,__pycache__,build,dist --ignore=E402,W503

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t codesage .

  # Real Redis + API + RQ worker in containers, with fake GitHub/Groq APIs:
  # send a signed webhook and require the review to be posted.
  e2e-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.demo.yml up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1
      - name: Send a signed pull_request webhook
        run: >
          docker compose -f docker-compose.demo.yml exec -T app
          python devtools/send_webhook.py
          --url http://localhost:8000 --fake-url http://fake:9000
      - name: Unsigned webhook is rejected
        run: >
          docker compose -f docker-compose.demo.yml exec -T app
          python devtools/send_webhook.py --url http://localhost:8000 --unsigned
      - name: Logs
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs
